<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shisha Barcode</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:-apple-system,sans-serif;background:#f4f5f7;margin:0;padding:16px;color:#202124}main{max-width:560px;margin:auto}section{background:white;border-radius:14px;padding:16px;margin:14px 0}button,input,select{width:100%;box-sizing:border-box;font-size:16px;padding:13px;margin:6px 0;border-radius:9px;border:1px solid #ccc}button{background:#222;color:white;border:0}button:disabled{opacity:.5}.hidden{display:none}#status{white-space:pre-wrap;overflow-wrap:anywhere;background:#e7edf9;padding:12px;border-radius:10px}#reader{width:100%}</style></head>
<body><main><h2>💨 Shisha Barcode Manager</h2><section><div id="reader"></div><button id="start">📷 カメラを起動</button><button id="stop" class="hidden">カメラを停止</button><p>読み取った後は一時停止します。登録後に「次を読み取る」で再開できます。</p></section>
<section><label>手動入力（カメラが使えない場合）<input id="manual" inputmode="numeric" placeholder="バーコード8〜14桁"></label><button id="manualGo">番号を検索</button></section>
<section id="form" class="hidden"><h3>未登録バーコード</h3><p id="barcode"></p><label>メーカー<select id="maker"><option value="">すべて</option></select></label><label>フレーバー検索<input id="search" placeholder="名前を入力"></label><label>フレーバー<select id="flavor"></select></label><button id="save">紐づけ登録</button></section>
<section id="result" class="hidden"><h3 id="resultTitle"></h3><p id="resultText"></p><button id="next">次を読み取る</button></section><p id="status">読み込み中...</p></main>
<script>
const $=id=>document.getElementById(id);let scanner=null,flavors=[],current='',busy=false;
function status(s){$('status').textContent=s}
function errorText(e){return typeof e==='string'?e:(e?.message||String(e))}
async function api(action,other={}){const r=await fetch('/api/barcodes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...other})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'API error');return j.data}
function filter(){const maker=$('maker').value,q=$('search').value.trim().toLowerCase();const items=flavors.filter(f=>(!maker||f.maker===maker)&&f.flavor.toLowerCase().includes(q));$('flavor').replaceChildren(...items.map(f=>{const o=document.createElement('option');o.value=f.id;o.textContent=f.maker+' / '+f.flavor;return o}));$('save').disabled=!items.length}
async function init(){try{flavors=await api('list');const makers=[...new Set(flavors.map(f=>f.maker))].sort();for(const m of makers){const o=document.createElement('option');o.value=m;o.textContent=m;$('maker').append(o)}filter();status('準備完了：'+flavors.length+'種類')}catch(e){status('初期化エラー：'+errorText(e))}}
async function stop(){if(scanner){try{if(scanner.isScanning)await scanner.stop();scanner.clear()}catch(e){console.warn(e)}scanner=null}$('start').classList.remove('hidden');$('stop').classList.add('hidden')}
async function start(){if(scanner||busy)return;try{if(!window.Html5Qrcode)throw Error('読み取りライブラリが読み込めません');if(!navigator.mediaDevices?.getUserMedia)throw Error('カメラAPIが利用できません');$('form').classList.add('hidden');$('result').classList.add('hidden');status('カメラ起動中...');scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128]});await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},async value=>{if(busy)return;busy=true;await stop();try{await lookup(value)}finally{busy=false}},()=>{});$('start').classList.add('hidden');$('stop').classList.remove('hidden');status('バーコードを映してください')}catch(e){await stop();status('カメラ起動エラー：'+errorText(e))}}
async function lookup(value){current=String(value).trim();if(!/^\d{8,14}$/.test(current)){status('8〜14桁のバーコードを入力してください');return}try{$('form').classList.add('hidden');$('result').classList.add('hidden');status('照合中：'+current);const data=await api('lookup',{barcode:current});if(data.found){const f=flavors.find(x=>x.id===data.flavorId);showResult('登録済み',current+'\n'+(f?f.maker+' / '+f.flavor:'ID: '+data.flavorId))}else{$('barcode').textContent=current;$('form').classList.remove('hidden');filter();status('未登録：フレーバーを選んで登録してください')}}catch(e){status('照合エラー：'+errorText(e))}}
function showResult(title,txt){$('form').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=title;$('resultText').textContent=txt;$('resultText').style.whiteSpace='pre-wrap';status(title)}
$('start').onclick=start;$('stop').onclick=stop;$('maker').onchange=filter;$('search').oninput=filter;$('manualGo').onclick=async()=>{await stop();await lookup($('manual').value)};
$('save').onclick=async()=>{const id=$('flavor').value;if(!id)return;const barcode=current;$('save').disabled=true;try{const data=await api('register',{barcode,flavorId:id});showResult('登録完了',data.barcode+'\n'+data.flavor.maker+' / '+data.flavor.flavor)}catch(e){status('登録エラー：'+errorText(e))}finally{filter()}};
$('next').onclick=async()=>{$('result').classList.add('hidden');$('manual').value='';await start()};init();
</script></body></html>
