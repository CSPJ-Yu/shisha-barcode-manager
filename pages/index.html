
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shisha Barcode Manager</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f5f7;
  color: #202124;
  margin: 0;
  padding: 16px;
}

main {
  max-width: 560px;
  margin: auto;
}

section {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0;
}

button, input, select {
  width: 100%;
  font-size: 16px;
  padding: 13px;
  margin: 6px 0;
  border-radius: 9px;
  border: 1px solid #ccc;
}

button {
  background: #222;
  color: white;
  border: 0;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.hidden {
  display: none !important;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 10px;
}

#reader video {
  max-width: 100%;
}

#status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #e7edf9;
  padding: 12px;
  border-radius: 10px;
}

#resultText {
  white-space: pre-wrap;
}

.hint {
  font-size: 13px;
  color: #666;
  line-height: 1.6;
}
</style>
</head>

<body>
<main>

<h2>💨 Shisha Barcode Manager</h2>

<section>
  <h3>📷 バーコード読み取り</h3>

  <div id="reader"></div>

  <button id="start">カメラを起動</button>
  <button id="stop" class="hidden">カメラを停止</button>

  <p class="hint">
    バーコードの線全体が読み取り枠に収まるようにしてください。
    ピントが合わない場合は少し離してみてください。
  </p>
</section>

<section>
  <h3>⌨️ 手動入力</h3>

  <label for="manual">バーコード番号</label>
  <input
    id="manual"
    inputmode="numeric"
    autocomplete="off"
    placeholder="バーコード8〜14桁"
  >

  <button id="manualGo">番号を検索</button>
</section>

<section id="form" class="hidden">
  <h3>未登録バーコード</h3>
  <p id="barcode"></p>

  <label for="maker">メーカー</label>
  <select id="maker">
    <option value="">すべて</option>
  </select>

  <label for="search">フレーバー検索</label>
  <input id="search" placeholder="名前を入力">

  <label for="flavor">フレーバー</label>
  <select id="flavor"></select>

  <button id="save">紐づけ登録</button>
</section>

<section id="result" class="hidden">
  <h3 id="resultTitle"></h3>
  <p id="resultText"></p>
  <button id="next">次を読み取る</button>
</section>

<p id="status">読み込み中...</p>

</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

let scanner = null;
let flavors = [];
let current = "";
let busy = false;
let cameraBusy = false;

function status(message) {
  $("status").textContent = message;
}

function errorText(error) {
  return typeof error === "string"
    ? error
    : (error?.message || String(error));
}

async function api(action, other = {}) {
  const response = await fetch("/api/barcodes", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action,
      ...other
    })
  });

  const result = await response.json();

  if (!response.ok || !result.ok) {
    throw new Error(result.error || "API error");
  }

  return result.data;
}

function filter() {
  const maker = $("maker").value;
  const query = $("search").value.trim().toLowerCase();

  const items = flavors.filter(f =>
    (!maker || f.maker === maker) &&
    String(f.flavor).toLowerCase().includes(query)
  );

  const options = items.map(f => {
    const option = document.createElement("option");
    option.value = f.id;
    option.textContent = f.maker + " / " + f.flavor;
    return option;
  });

  $("flavor").replaceChildren(...options);
  $("save").disabled = !items.length || busy;
}

async function init() {
  try {
    flavors = await api("list");

    const makers = [
      ...new Set(flavors.map(f => f.maker))
    ].sort();

    for (const maker of makers) {
      const option = document.createElement("option");
      option.value = maker;
      option.textContent = maker;
      $("maker").append(option);
    }

    filter();

    status(
      "準備完了：" +
      flavors.length +
      "種類のフレーバーを取得"
    );

  } catch (error) {
    status("初期化エラー：" + errorText(error));
  }
}

function cameraButtons(scanning) {
  $("start").classList.toggle("hidden", scanning);
  $("stop").classList.toggle("hidden", !scanning);
}

async function stop() {
  if (cameraBusy) return;

  cameraBusy = true;

  try {
    if (scanner) {
      const instance = scanner;

      if (instance.isScanning) {
        await instance.stop();
      }

      instance.clear();
      scanner = null;
    }

    cameraButtons(false);

  } catch (error) {
    console.warn("Camera stop error:", error);
    status("カメラ停止エラー：" + errorText(error));

  } finally {
    cameraBusy = false;
  }
}

async function start() {
  if (scanner || busy || cameraBusy) return;

  cameraBusy = true;

  try {
    if (!window.Html5Qrcode) {
      throw new Error(
        "バーコード読み取りライブラリを読み込めません"
      );
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        "このブラウザではカメラを利用できません"
      );
    }

    $("form").classList.add("hidden");
    $("result").classList.add("hidden");

    status("カメラ起動中...");

    scanner = new Html5Qrcode("reader", {

  formatsToSupport: [

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E

  ],

  useBarCodeDetectorIfSupported: false,

  verbose: false

});

    const instance = scanner;

    await instance.start(
      { facingMode: "environment" },
      {
  fps: 15,
  qrbox: (width, height) => ({
    // width: Math.max(1, Math.floor(width * 0.9)),
    // height: Math.max(1, Math.floor(height * 0.65))
  })
},

      async decodedText => {
        if (busy) return;

        busy = true;

        try {
          status("読み取り成功：" + decodedText);

          if (instance.isScanning) {
            await instance.stop();
          }

          instance.clear();

          if (scanner === instance) {
            scanner = null;
          }

          cameraButtons(false);

          await lookup(decodedText);

        } catch (error) {
          status(
            "読み取り処理エラー：" +
            errorText(error)
          );

        } finally {
          busy = false;
        }
      },

      () => {
        // 読み取り失敗は通常動作のため無視
      }
    );

    cameraButtons(true);
    status("スキャン中：バーコードを枠内に映してください");

  } catch (error) {
    status("カメラ起動エラー：" + errorText(error));

    if (scanner) {
      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }

        scanner.clear();
      } catch (cleanupError) {
        console.warn(cleanupError);
      }

      scanner = null;
    }

    cameraButtons(false);

  } finally {
    cameraBusy = false;
  }
}

async function lookup(value) {
  current = String(value).trim();

  if (!/^\d{8,14}$/.test(current)) {
    status("8〜14桁の数字バーコードを入力してください");
    return;
  }

  try {
    $("form").classList.add("hidden");
    $("result").classList.add("hidden");

    status("照合中：" + current);

    const data = await api("lookup", {
      barcode: current
    });

    if (data.found) {
      const flavor = flavors.find(
        f => f.id === data.flavorId
      );

      showResult(
        "登録済み",
        current + "\n" +
        (
          flavor
            ? flavor.maker + " / " + flavor.flavor
            : "ID: " + data.flavorId
        )
      );

    } else {
      $("barcode").textContent = current;
      $("form").classList.remove("hidden");

      filter();

      status(
        "未登録：フレーバーを選んで登録してください"
      );
    }

  } catch (error) {
    status("照合エラー：" + errorText(error));
  }
}

function showResult(title, text) {
  $("form").classList.add("hidden");
  $("result").classList.remove("hidden");

  $("resultTitle").textContent = title;
  $("resultText").textContent = text;

  status(title);
}

$("start").onclick = start;
$("stop").onclick = stop;

$("maker").onchange = filter;
$("search").oninput = filter;

$("manualGo").onclick = async () => {
  await stop();
  await lookup($("manual").value);
};

$("save").onclick = async () => {
  const flavorId = $("flavor").value;

  if (!flavorId || busy) return;

  busy = true;
  $("save").disabled = true;

  try {
    const data = await api("register", {
      barcode: current,
      flavorId
    });

    showResult(
      "登録完了",
      data.barcode + "\n" +
      data.flavor.maker + " / " +
      data.flavor.flavor
    );

  } catch (error) {
    status("登録エラー：" + errorText(error));

  } finally {
    busy = false;
    filter();
  }
};

$("next").onclick = async () => {
  $("result").classList.add("hidden");
  $("manual").value = "";

  await start();
};

init();
</script>
</body>
</html>
